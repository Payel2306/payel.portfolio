<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payel Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #000;
      color: white;
    }

    /* NAVBAR */
    header {
      display: flex;
      justify-content: space-between;
      padding: 20px 60px;
      align-items: center;
    }

    nav a {
      color: white;
      margin-left: 25px;
      text-decoration: none;
      font-size: 16px;
    }

    nav a:hover {
      color: orange;
    }

    /* HERO SECTION */
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 80px 60px;
    }

    .hero-text {
      max-width: 500px;
    }

    .hero-text p {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .hero-text h1 {
      font-size: 70px;
      line-height: 1.2;
    }

    .hero-text span {
      color: orange;
      font-size: 75px;
      font-weight: bold;
    }

    .hero-text h3 {
      font-size: 30px;
      margin: 15px 0;
      color: #ccc;
    }

    .btn {
      background: orange;
      border: none;
      padding: 14px 28px;
      font-size: 18px;
      margin-right: 10px;
      cursor: pointer;
    }

    .btn-outline {
      border: 2px solid orange;
      padding: 14px 28px;
      font-size: 18px;
      background: transparent;
      color: white;
      cursor: pointer;
    }

    /* IMAGE */
    .hero-img img {
      width: 300px;
      border-radius: 15px;
    }

    /* ABOUT */
    .about {
      display: flex;
      align-items: center;
      padding: 60px;
      gap: 40px;
    }

    .about img {
      width: 250px;
      border-radius: 10px;
    }

    .about-text h2 {
      font-size: 35px;
      margin-bottom: 10px;
    }

    .about-text p {
      margin-bottom: 10px;
      color: #ccc;
    }

    .about-text ul {
      list-style: none;
    }

    /* SKILLS */
    .skills {
      padding: 60px;
    }

    .skills h2 {
      font-size: 35px;
      margin-bottom: 20px;
    }

    .bar {
      background: #333;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 20px;
    }

    .bar span {
      display: block;
      height: 100%;
      background: orange;
      border-radius: 5px;
    }

  </style>
</head>

<body>

<!-- NAVBAR -->
<header>
  <h2>PAYEL</h2>
  <nav>
    <a href="#">Home</a>
    <a href="#about">About</a>
    <a href="#skills">Skills</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-text">
    <p>Hello!</p>
    <h1>I'm <span>Payel Das</span></h1>
    <h3>Fullstack Web Developer</h3>

    <button class="btn" onclick="scrollToSection('about')">Hire Me</button>
    <button class="btn-outline" onclick="scrollToSection('skills')">My Works</button>
  </div>

  <div class="hero-img">
    <!-- YOUR IMAGE -->
    <img src="payel.jpg" alt="Payel Das">
  </div>
</section>

<!-- ABOUT -->
<section id="about" class="about">
  <img src="payel.jpg" alt="Payel Das">

  <div class="about-text">
    <h2>About Me</h2>
    <p>I am a passionate developer building modern web applications.</p>

    <ul>
      <li><strong>Name:</strong> Payel Das</li>
      <li><strong>Email:</strong> daspayel.2306@gmail.com</li>
      <li><strong>Location:</strong> West Bengal, Purulia</li>
    </ul>
  </div>
</section>

<!-- SKILLS -->
<section id="skills" class="skills">
  <h2>My Skills</h2>

  <p>Web Development</p>
  <div class="bar"><span style="width:95%"></span></div>

  <p>Content Creation</p>
  <div class="bar"><span style="width:90%"></span></div>
</section>

<script>
function scrollToSection(id) {
  document.getElementById(id).scrollIntoView({
    behavior: 'smooth'
  });
}
</script>

</body>
</html>
